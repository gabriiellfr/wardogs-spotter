name: Release

# Pushing a tag like v0.1.0 builds the Windows executable and publishes a
# release with it, described by that version's section of CHANGELOG.md.
# Running the workflow by hand only builds, to try the build before tagging:
# the zip is then in the run's artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build the executable
    runs-on: windows-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install
        run: uv sync --locked --group build
      - name: Read the version
        id: version
        run: echo "version=$(uv run python -c 'import wardogs_spotter; print(wardogs_spotter.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Check that the tag is the version
        if: github.ref_type == 'tag'
        run: |
          if [ "$GITHUB_REF_NAME" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but the code says version ${{ steps.version.outputs.version }}"
            exit 1
          fi
      - name: Tests
        run: uv run pytest
      - name: Release notes from the changelog
        run: uv run python packaging/release_notes.py "${{ steps.version.outputs.version }}" dist/release-notes.md
      - name: Build
        run: uv run pyinstaller packaging/wardogs-spotter.spec --noconfirm
      - name: Try the executable
        # It has to start, and to read a real frame with the glyphs it carries.
        run: |
          dist/wardogs-spotter/wardogs-spotter.exe --version
          dist/wardogs-spotter/wardogs-spotter.exe read tests/fixtures | tee read.txt
          grep -q "cursor x85.46 y67.85" read.txt
      - name: Zip
        run: |
          name="wardogs-spotter-${{ steps.version.outputs.version }}-windows-x64"
          uv run python -c "import shutil, sys; shutil.make_archive(sys.argv[1], 'zip', 'dist', 'wardogs-spotter')" "dist/$name"
          cd dist
          sha256sum "$name.zip" > "$name.zip.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/release-notes.md
          if-no-files-found: error

  publish:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release; the build above runs without it
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" *.zip *.zip.sha256
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --notes-file release-notes.md
